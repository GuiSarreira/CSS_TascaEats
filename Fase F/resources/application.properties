spring.application.name=entrega-service
server.port=8081

# ── DataSource (entrega-db) ─────────────────────────────────────
# Valores por omissão para Docker; podem ser sobrepostos via env vars
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/entrega_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:entrega_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:entrega_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ── Kafka ───────────────────────────────────────────────────────
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# EntregaService 
entrega.service.url=http://entrega-service:8081
