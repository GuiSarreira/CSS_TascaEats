<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}" lang="pt">

<head>
    <meta charset="UTF-8">
    <title>As Minhas Moradas</title>
</head>

<div layout:fragment="content">
    <div class="page-shell-te" style="max-width:900px;">

        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a th:href="@{/pedidos(clienteId=${cliente.id})}">Pedidos</a></li>
                <li class="breadcrumb-item active">Moradas</li>
            </ol>
        </nav>

        <h2 class="page-title-te">Moradas de <span th:text="${cliente.nome}"></span></h2>

        <!-- Lista de moradas guardadas -->
        <div class="surface-card-te mb-2">
            <div class="card-header">Moradas guardadas</div>
            <ul class="list-group list-group-flush">
                <li th:each="morada, iter : ${moradas}"
                    class="list-group-item d-flex justify-content-between align-items-center">
                    <span>
                        <strong th:text="${morada.rua}"></strong>,
                        <span th:text="${morada.codigoPostal}"></span>
                        <span th:text="${morada.cidade}"></span>
                    </span>
                    <form th:action="@{/cliente/{id}/moradas/{idx}/remover(id=${cliente.id},idx=${iter.index})}"
                        method="post" style="display:inline">
                        <button type="submit" class="btn-te btn-te-danger btn-te-sm"
                            onclick="return confirm('Remover esta morada?')">Remover</button>
                    </form>
                </li>
                <li th:if="${#lists.isEmpty(moradas)}" class="list-group-item text-muted">
                    Sem moradas guardadas.
                </li>
            </ul>
        </div>

        <!-- Formulário para adicionar nova morada -->
        <div class="surface-card-te">
            <div class="card-header">Adicionar nova morada</div>
            <div class="card-body">
                <form th:action="@{/cliente/{id}/moradas(id=${cliente.id})}" method="post">
                    <div class="mb-3 field-group-inline-te">
                        <label>Rua e número</label>
                        <input type="text" name="rua" required placeholder="Ex: Rua das Flores, 10">
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-4">
                            <div class="field-group-inline-te">
                                <label>Código Postal</label>
                                <input type="text" name="codigoPostal" required placeholder="1200-123">
                            </div>
                        </div>
                        <div class="col-md-8">
                            <div class="field-group-inline-te">
                                <label>Cidade</label>
                                <input type="text" name="cidade" required placeholder="Lisboa">
                            </div>
                        </div>
                    </div>
                    <button type="submit" class="btn-te btn-te-primary">Adicionar morada</button>
                </form>
            </div>
        </div>
    </div>

</div>

</html>
