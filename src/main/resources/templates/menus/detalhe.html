<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}" lang="pt">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="'Menu: ' + ${menu.nome} + ' — TascaEats'">Menu — TascaEats</title>
</head>

<div layout:fragment="content">
    <div class="page-shell-te">
        <div class="page-header-te">
            <div>
                <h1 class="page-title-te" th:text="${menu.nome}">Nome do Menu</h1>
                <p class="page-subtitle-te" th:text="${menu.descricao != null ? menu.descricao : 'Sem descrição'}"></p>
            </div>
        </div>

        <div class="page-header-te">
            <div class="d-flex gap-2 flex-wrap">
                <a th:href="@{/menus}" class="btn-te btn-te-secondary">← Voltar</a>
            </div>
        </div>

        <!-- Produtos -->
        <div class="surface-card-te">
            <h2>Produtos (<span th:text="${menu.produtos.size()}">0</span>)</h2>
            <div class="table-shell-te" th:if="${!menu.produtos.isEmpty()}">
                <table class="table-te">
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Categoria</th>
                            <th>Preço</th>
                            <th>Disponível</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="p : ${menu.produtos}">
                            <td th:text="${p.nome}"></td>
                            <td th:text="${p.categoria}"></td>
                            <td th:text="${#numbers.formatDecimal(p.preco, 1, 2)} + ' €'"></td>
                            <td th:text="${p.disponivel ? 'Sim' : 'Não'}"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <p class="vazio-te" th:if="${menu.produtos.isEmpty()}">Nenhum produto associado a este menu.</p>
        </div>

        <!-- Restaurantes associados -->
        <div class="surface-card-te">
            <h2>Restaurantes (<span th:text="${menu.restaurantes.size()}">0</span>)</h2>
            <div class="table-shell-te" th:if="${!menu.restaurantes.isEmpty()}">
                <table class="table-te">
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Cozinha</th>
                            <th>Estado</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="r : ${menu.restaurantes}">
                            <td><a th:href="@{/restaurantes/{id}(id=${r.id})}" th:text="${r.nome}"></a></td>
                            <td th:text="${r.tipoCozinha != null ? r.tipoCozinha : '—'}"></td>
                            <td th:text="${r.aberto ? 'Aberto' : 'Fechado'}"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <p class="vazio-te" th:if="${menu.restaurantes.isEmpty()}">Nenhum restaurante associado.</p>
        </div>
    </div>
</div>

</html>
