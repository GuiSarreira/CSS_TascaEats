<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}" lang="pt">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${menu != null ? 'Editar Menu — TascaEats' : 'Novo Menu — TascaEats'}">Menu — TascaEats</title>
</head>

<div layout:fragment="content">
    <div class="page-shell-te" style="max-width:760px;">
        <div class="page-header-te">
            <h1 class="page-title-te" th:text="${menu != null ? 'Editar Menu' : 'Novo Menu'}">Menu</h1>
        </div>

        <div class="surface-card-te">
            <form th:action="${menu != null ? '/menus/' + menu.id : '/menus'}" method="post">

                <div class="field-group-inline-te mb-3">
                    <label for="nome">Nome *</label>
                    <input id="nome" name="nome" required th:value="${menu != null ? menu.nome : ''}" />
                </div>

                <div class="field-group-inline-te mb-3">
                    <label for="descricao">Descrição</label>
                    <textarea id="descricao" name="descricao"
                        th:text="${menu != null ? menu.descricao : ''}"></textarea>
                </div>

                <div class="field-group-inline-te mb-3">
                    <label>Produtos</label>
                    <div class="border rounded p-2" style="max-height:200px; overflow-y:auto;">
                        <div th:if="${produtos == null || produtos.isEmpty()}">
                            <em>Nenhum produto disponível.</em>
                        </div>
                        <label th:each="p : ${produtos}" class="d-flex align-items-center gap-2 py-1">
                            <input class="form-check-input m-0" type="checkbox" name="produtoIds" th:value="${p.id}"
                                th:checked="${menu != null && menu.produtos.contains(p)}" />
                            <span th:text="${p.nome + ' — ' + p.preco + ' €'}"></span>
                        </label>
                    </div>
                </div>

                <div class="field-group-inline-te mb-3">
                    <label>Restaurantes</label>
                    <div class="border rounded p-2" style="max-height:200px; overflow-y:auto;">
                        <div th:if="${restaurantes == null || restaurantes.isEmpty()}">
                            <em>Nenhum restaurante disponível.</em>
                        </div>
                        <label th:each="r : ${restaurantes}" class="d-flex align-items-center gap-2 py-1">
                            <input class="form-check-input m-0" type="checkbox" name="restauranteIds" th:value="${r.id}"
                                th:checked="${menu != null && menu.restaurantes.contains(r)}" />
                            <span th:text="${r.nome}"></span>
                        </label>
                    </div>
                </div>

                <div class="d-flex gap-2 mt-3">
                    <button type="submit" class="btn-te btn-te-primary"
                        th:text="${menu != null ? 'Guardar Alterações' : 'Criar Menu'}">Submeter</button>
                    <a th:href="@{/menus}" class="btn-te btn-te-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>

</html>
