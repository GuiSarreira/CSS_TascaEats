<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Menus — TascaEats</title>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #f5f5f5;
            color: #333;
        }

        .container {
            max-width: 960px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        h1 {
            font-size: 1.75rem;
            margin-bottom: 1.5rem;
        }

        a {
            color: #1a73e8;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .filtros {
            background: #fff;
            padding: 1.25rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            box-shadow: 0 1px 3px rgba(0, 0, 0, .1);
        }

        .filtros form {
            display: flex;
            flex-wrap: wrap;
            gap: .75rem;
            align-items: flex-end;
        }

        .filtros label {
            display: block;
            font-size: .8rem;
            color: #666;
            margin-bottom: .25rem;
        }

        .filtros input {
            padding: .45rem .6rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: .9rem;
        }

        .filtros button {
            padding: .5rem 1rem;
            background: #1a73e8;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: .9rem;
        }

        .filtros button:hover {
            background: #1558b0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 1px 3px rgba(0, 0, 0, .1);
        }

        th,
        td {
            padding: .75rem 1rem;
            text-align: left;
        }

        th {
            background: #fafafa;
            font-weight: 600;
            font-size: .85rem;
            color: #555;
            border-bottom: 2px solid #eee;
        }

        td {
            border-bottom: 1px solid #f0f0f0;
            font-size: .9rem;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background: #f8fbff;
        }

        .btn-novo {
            display: inline-block;
            margin-bottom: 1rem;
            padding: .5rem 1.25rem;
            background: #34a853;
            color: #fff;
            border-radius: 4px;
            font-weight: 500;
        }

        .btn-novo:hover {
            background: #2d8f47;
            text-decoration: none;
        }

        .vazio {
            text-align: center;
            padding: 2rem;
            color: #999;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Menus Partilhados</h1>

        <div class="filtros">
            <form th:action="@{/menus}" method="get">
                <div>
                    <label for="nome">Nome</label>
                    <input id="nome" name="nome" th:value="${filtroNome}" placeholder="Pesquisar..." />
                </div>
                <div>
                    <label for="minProdutos">Mín. Produtos</label>
                    <input id="minProdutos" name="minProdutos" type="number" th:value="${filtroMinProdutos}" />
                </div>
                <div>
                    <label for="maxProdutos">Máx. Produtos</label>
                    <input id="maxProdutos" name="maxProdutos" type="number" th:value="${filtroMaxProdutos}" />
                </div>
                <div>
                    <label for="minPreco">Preço Mín. (€)</label>
                    <input id="minPreco" name="minPreco" type="number" step="0.01" th:value="${filtroMinPreco}" />
                </div>
                <div>
                    <label for="maxPreco">Preço Máx. (€)</label>
                    <input id="maxPreco" name="maxPreco" type="number" step="0.01" th:value="${filtroMaxPreco}" />
                </div>
                <button type="submit">Filtrar</button>
            </form>
        </div>

        <a class="btn-novo" th:href="@{/menus/novo}">+ Novo Menu</a>

        <table th:if="${!menus.isEmpty()}">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Descrição</th>
                    <th>Produtos</th>
                    <th>Restaurantes</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="menu : ${menus}">
                    <td th:text="${menu.id}"></td>
                    <td><a th:href="@{/menus/{id}(id=${menu.id})}" th:text="${menu.nome}"></a></td>
                    <td th:text="${menu.descricao != null ? menu.descricao : '—'}"></td>
                    <td th:text="${menu.produtos.size()}"></td>
                    <td th:text="${menu.restaurantes.size()}"></td>
                </tr>
            </tbody>
        </table>

        <p class="vazio" th:if="${menus.isEmpty()}">Nenhum menu encontrado.</p>
    </div>
</body>

</html>
