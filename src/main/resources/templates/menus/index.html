<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}" lang="pt">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Menus — TascaEats</title>
</head>

<div layout:fragment="content">
    <div class="page-shell-te">
        <div class="page-header-te">
            <h1 class="page-title-te">Menus Partilhados</h1>
        </div>

        <div class="surface-card-te">
            <form th:action="@{/menus}" method="get" class="filters-form-te">
                <div class="field-group-inline-te">
                    <label for="nome">Nome</label>
                    <input id="nome" name="nome" th:value="${filtroNome}" placeholder="Pesquisar..." />
                </div>
                <div class="field-group-inline-te">
                    <label for="minProdutos">Mín. Produtos</label>
                    <input id="minProdutos" name="minProdutos" type="number" th:value="${filtroMinProdutos}" />
                </div>
                <div class="field-group-inline-te">
                    <label for="maxProdutos">Máx. Produtos</label>
                    <input id="maxProdutos" name="maxProdutos" type="number" th:value="${filtroMaxProdutos}" />
                </div>
                <div class="field-group-inline-te">
                    <label for="minPreco">Preço Mín. (€)</label>
                    <input id="minPreco" name="minPreco" type="number" step="0.01" th:value="${filtroMinPreco}" />
                </div>
                <div class="field-group-inline-te">
                    <label for="maxPreco">Preço Máx. (€)</label>
                    <input id="maxPreco" name="maxPreco" type="number" step="0.01" th:value="${filtroMaxPreco}" />
                </div>
                <div>
                    <button type="submit" class="btn-te btn-te-primary">Filtrar</button>
                </div>
                <div>
                    <a th:href="@{/menus}" class="btn-te btn-te-outline">Limpar</a>
                </div>
                <div>
                    <a th:href="@{/menus}" class="btn-te btn-te-secondary">Recarregar</a>
                </div>
            </form>
        </div>

        <div class="surface-card-te table-shell-te" th:if="${!menus.isEmpty()}">
            <table class="table-te">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>Descrição</th>
                        <th>Produtos</th>
                        <th>Restaurantes</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="menu : ${menus}">
                        <td th:text="${menu.id}"></td>
                        <td><a th:href="@{/menus/{id}(id=${menu.id})}" th:text="${menu.nome}"></a></td>
                        <td th:text="${menu.descricao != null ? menu.descricao : '—'}"></td>
                        <td th:text="${menu.produtos.size()}"></td>
                        <td th:text="${menu.restaurantes.size()}"></td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="surface-card-te" th:if="${menus.isEmpty()}">
            <p class="vazio-te">Nenhum menu encontrado.</p>
        </div>
    </div>
</div>

</html>
