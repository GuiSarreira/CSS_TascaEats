<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}" lang="pt">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Restaurantes — TascaEats</title>
</head>

<div layout:fragment="content">
    <div class="page-shell-te">
        <div class="page-header-te">
            <h1 class="page-title-te">Restaurantes</h1>
        </div>

        <div class="surface-card-te">
            <form th:action="@{/restaurantes}" method="get" class="filters-form-te">
                <div class="field-group-inline-te"><label for="nome">Nome</label>
                    <input id="nome" name="nome" th:value="${filtroNome}" placeholder="Pesquisar..." />
                </div>
                <div class="field-group-inline-te"><label for="morada">Morada</label>
                    <input id="morada" name="morada" th:value="${filtroMorada}" placeholder="Rua, cidade ou CP..." />
                </div>
                <div class="field-group-inline-te"><label for="tipoCozinha">Cozinha</label>
                    <input id="tipoCozinha" name="tipoCozinha" th:value="${filtroTipoCozinha}"
                        placeholder="Portuguesa..." />
                </div>
                <div class="field-group-inline-te"><label for="cidade">Cidade</label>
                    <input id="cidade" name="cidade" th:value="${filtroCidade}" placeholder="Lisboa..." />
                </div>
                <div class="field-group-inline-te"><label for="horario">Horário</label>
                    <input id="horario" name="horario" type="time" th:value="${filtroHorario}" />
                </div>
                <div class="field-group-inline-te"><label for="estado">Estado</label>
                    <select id="estado" name="estado">
                        <option value="TODOS" th:selected="${filtroEstado == null or filtroEstado == 'TODOS'}">Todos
                        </option>
                        <option value="ABERTO" th:selected="${filtroEstado == 'ABERTO'}">Aberto</option>
                        <option value="FECHADO" th:selected="${filtroEstado == 'FECHADO'}">Fechado</option>
                    </select>
                </div>
                <div class="field-group-inline-te"><label for="minPreco">Preço Mín.</label>
                    <input id="minPreco" name="minPreco" type="number" step="0.01" th:value="${filtroMinPreco}" />
                </div>
                <div class="field-group-inline-te"><label for="maxPreco">Preço Máx.</label>
                    <input id="maxPreco" name="maxPreco" type="number" step="0.01" th:value="${filtroMaxPreco}" />
                </div>
                <div class="field-group-inline-te"><label for="minPedidos">Mín. Pedidos</label>
                    <input id="minPedidos" name="minPedidos" type="number" min="0" th:value="${filtroMinPedidos}" />
                </div>
                <div class="field-group-inline-te"><label for="minAvaliacoes">Mín. Aval.</label>
                    <input id="minAvaliacoes" name="minAvaliacoes" type="number" th:value="${filtroMinAvaliacoes}" />
                </div>
                <div>
                    <button type="submit" class="btn-te btn-te-primary">Filtrar</button>
                </div>
                <div>
                    <a th:href="@{/restaurantes}" class="btn-te btn-te-outline">Limpar</a>
                </div>
                <div>
                    <a th:href="@{/restaurantes}" class="btn-te btn-te-secondary">Recarregar</a>
                </div>
            </form>
        </div>

        <div class="cards-grid-te" th:if="${!restaurantes.isEmpty()}">
            <div class="result-card-te" th:each="r : ${restaurantes}">
                <h3><a th:href="@{/restaurantes/{id}(id=${r.id})}" th:text="${r.nome}">Restaurante</a></h3>
                <div class="meta-list-te">
                    <span class="pill-te" th:classappend="${r.aberto ? 'pill-open-te' : 'pill-closed-te'}"
                        th:text="${r.aberto ? 'Aberto' : 'Fechado'}"></span><br />
                    <span th:if="${r.tipoCozinha != null}" th:text="'Cozinha: ' + ${r.tipoCozinha}"></span><br />
                    <span th:if="${r.morada != null}" th:text="${r.morada.rua + ', ' + r.morada.cidade}"></span><br />
                    <span th:if="${r.horarioAbertura != null}"
                        th:text="'Horário: ' + ${r.horarioAbertura} + ' – ' + ${r.horarioFecho}"></span>
                </div>
            </div>
        </div>

        <div class="surface-card-te" th:if="${restaurantes.isEmpty()}">
            <p class="vazio-te">Nenhum restaurante encontrado.</p>
        </div>
    </div>
</div>

</html>
