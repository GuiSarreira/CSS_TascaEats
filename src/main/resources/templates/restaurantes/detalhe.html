<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}" lang="pt">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${restaurante.nome} + ' — TascaEats'">Restaurante — TascaEats</title>
</head>

<div layout:fragment="content">
    <div class="page-shell-te">
        <a class="back-link-te" th:href="@{/restaurantes}">← Voltar à lista</a>

        <div class="page-header-te">
            <div>
                <h1 class="page-title-te" th:text="${restaurante.nome}">Restaurante</h1>
                <p class="page-subtitle-te">
                    <span class="pill-te" th:classappend="${restaurante.aberto ? 'pill-open-te' : 'pill-closed-te'}"
                        th:text="${restaurante.aberto ? 'Aberto' : 'Fechado'}"></span>
                </p>
            </div>
        </div>

        <!-- Informações gerais -->
        <div class="surface-card-te">
            <dl class="info-grid">
                <dt>NIF</dt>
                <dd th:text="${restaurante.nif}"></dd>
                <dt>Tipo de Cozinha</dt>
                <dd th:text="${restaurante.tipoCozinha != null ? restaurante.tipoCozinha : '—'}"></dd>
                <dt>Morada</dt>
                <dd
                    th:text="${restaurante.morada != null ? restaurante.morada.rua + ', ' + restaurante.morada.codigoPostal + ' ' + restaurante.morada.cidade : '—'}">
                </dd>
                <dt>Horário</dt>
                <dd
                    th:text="${restaurante.horarioAbertura != null ? restaurante.horarioAbertura + ' – ' + restaurante.horarioFecho : '—'}">
                </dd>
                <dt>Avaliação Média</dt>
                <dd>
                    <span class="rating" th:text="${'★'.repeat(mediaAvaliacoes.intValue())}"></span>
                    <span th:text="${#numbers.formatDecimal(mediaAvaliacoes, 1, 1)} + ' / 5'"></span>
                </dd>
            </dl>
        </div>

        <!-- Menu e Produtos -->
        <div class="surface-card-te">
            <h2>Menu &amp; Produtos</h2>
            <div th:if="${restaurante.menu != null}">
                <p><strong th:text="${restaurante.menu.nome}"></strong>
                    <span th:if="${restaurante.menu.descricao != null}"
                        th:text="' — ' + ${restaurante.menu.descricao}"></span>
                </p>
            </div>
            <div class="table-shell-te" th:if="${!produtos.isEmpty()}">
                <table class="table-te">
                    <thead>
                        <tr>
                            <th>Produto</th>
                            <th>Categoria</th>
                            <th>Preço</th>
                            <th>Disponível</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="p : ${produtos}">
                            <td th:text="${p.nome}"></td>
                            <td th:text="${p.categoria}"></td>
                            <td th:text="${#numbers.formatDecimal(p.preco, 1, 2)} + ' €'"></td>
                            <td th:text="${p.disponivel ? 'Sim' : 'Não'}"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <p class="vazio-te" th:if="${produtos.isEmpty()}">Nenhum produto no menu.</p>
        </div>

        <!-- Avaliações -->
        <div class="surface-card-te">
            <h2>Avaliações (<span th:text="${avaliacoes.size()}">0</span>)</h2>
            <div class="table-shell-te" th:if="${!avaliacoes.isEmpty()}">
                <table class="table-te">
                    <thead>
                        <tr>
                            <th>Nota</th>
                            <th>Comentário</th>
                            <th>Data</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="a : ${avaliacoes}">
                            <td th:text="${'★'.repeat(a.nota)}"></td>
                            <td th:text="${a.comentario != null ? a.comentario : '—'}"></td>
                            <td th:text="${#temporals.format(a.dataAvaliacao, 'dd/MM/yyyy HH:mm')}"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <p class="vazio-te" th:if="${avaliacoes.isEmpty()}">Ainda sem avaliações.</p>
        </div>
    </div>
</div>

</html>
