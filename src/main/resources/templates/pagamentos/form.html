<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}" lang="pt">

<head>
    <meta charset="UTF-8">
    <title>Pagamento</title>
</head>

<div layout:fragment="content">
    <div class="page-shell-te" style="max-width: 840px;">

        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item">
                    <a th:href="@{/pedidos(clienteId=${clienteId})}">Pedidos</a>
                </li>
                <li class="breadcrumb-item">
                    <a th:href="@{/pedidos/{id}(id=${pedido.id})}" th:text="'Pedido #' + ${pedido.id}"></a>
                </li>
                <li class="breadcrumb-item active">Pagamento</li>
            </ol>
        </nav>

        <h2 class="page-title-te">Pagamento do Pedido <span th:text="'#' + ${pedido.id}"></span></h2>
        <p class="page-subtitle-te">
            Total a pagar:
            <strong th:text="${#numbers.formatDecimal(pedido.precoTotal, 1, 2) + ' €'}"></strong>
        </p>

        <form th:action="@{/pagamentos}" method="post" id="pagamentoForm" class="surface-card-te">
            <input type="hidden" name="pedidoId" th:value="${pedido.id}">
            <input type="hidden" name="clienteId" th:value="${clienteId}">

            <!-- Tipo de pagamento -->
            <div class="mb-4 field-group-inline-te">
                <label class="form-label fw-bold">Tipo de pagamento</label>
                <div class="d-flex gap-3">
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="tipoPagamento" id="mbway" value="MBWAY"
                            onchange="showFields('MBWAY')" checked>
                        <label class="form-check-label" for="mbway">MBWay</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="tipoPagamento" id="multibanco"
                            value="MULTIBANCO" onchange="showFields('MULTIBANCO')">
                        <label class="form-check-label" for="multibanco">Multibanco</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="tipoPagamento" id="dinheiro" value="DINHEIRO"
                            onchange="showFields('DINHEIRO')">
                        <label class="form-check-label" for="dinheiro">Dinheiro</label>
                    </div>
                </div>
            </div>

            <!-- Campos MBWay -->
            <div id="fields-MBWAY">
                <div class="mb-3 field-group-inline-te">
                    <label>Número de telemóvel</label>
                    <input type="tel" name="dadosExtra" placeholder="912 345 678" pattern="[0-9]{9}">
                </div>
            </div>

            <!-- Campos Multibanco -->
            <div id="fields-MULTIBANCO" style="display:none">
                <div class="mb-3 field-group-inline-te">
                    <label>Referência</label>
                    <input type="text" name="dadosExtra" placeholder="123 456 789">
                </div>
                <div class="mb-3 field-group-inline-te">
                    <label>Provedor do cartão (bandeira)</label>
                    <select name="bandeira">
                        <option value="">— Selecionar —</option>
                        <option value="Visa">Visa</option>
                        <option value="Mastercard">Mastercard</option>
                        <option value="American Express">American Express</option>
                        <option value="Outro">Outro</option>
                    </select>
                </div>
            </div>

            <!-- Campos Dinheiro -->
            <div id="fields-DINHEIRO" style="display:none">
                <div class="mb-3 field-group-inline-te">
                    <label>Troco pretendido (€)</label>
                    <input type="number" name="troco" step="0.01" min="0" placeholder="0.00">
                    <div class="form-text">Deixe em branco se não necessitar de troco.</div>
                </div>
            </div>

            <div class="d-flex gap-2 mt-4">
                <button type="submit" class="btn-te btn-te-success">Confirmar Pagamento</button>
                <a th:href="@{/pedidos/{id}(id=${pedido.id})}" class="btn-te btn-te-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>

<script>
    function showFields(tipo) {
        ['MBWAY', 'MULTIBANCO', 'DINHEIRO'].forEach(t => {
            const el = document.getElementById('fields-' + t);
            if (el) el.style.display = (t === tipo) ? 'block' : 'none';
        });
    }
    // Inicializar com MBWay
    showFields('MBWAY');
</script>

</html>
