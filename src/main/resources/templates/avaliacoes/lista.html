<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}">

<head>
    <title th:text="${tipo == 'cliente'} ? 'Minhas Avaliações' : 'Avaliações do Restaurante'">Avaliações</title>
</head>
<div layout:fragment="content">
    <div class="page-shell-te">
        <div class="page-header-te">
            <h1 class="page-title-te" th:if="${tipo == 'cliente'}"><i class="fas fa-user-check"></i> Minhas Avaliações
            </h1>
            <h1 class="page-title-te" th:if="${tipo == 'restaurante'}"><i class="fas fa-store"></i> Avaliações do
                Restaurante</h1>
        </div>

        <div class="surface-card-te" th:if="${avaliacoes == null || #lists.isEmpty(avaliacoes)}">
            <p class="vazio-te">Nenhuma avaliação encontrada.</p>
        </div>
        <div th:unless="${avaliacoes == null || #lists.isEmpty(avaliacoes)}">
            <div class="surface-card-te" style="max-width: 860px;">
                <div class="d-grid gap-2">
                    <div th:each="av : ${avaliacoes}" class="result-card-te">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <strong th:text="${av.clienteNome}"></strong> avaliou
                                <strong th:text="${av.restauranteNome}"></strong>
                                <span class="rating ms-2">
                                    <span th:each="i, iterStat : ${#arrays.sequence(1, av.nota)}">★</span>
                                    <span th:each="i, iterStat : ${#arrays.sequence(av.nota+1, 5)}">☆</span>
                                </span>
                            </div>
                            <small class="text-muted"
                                th:text="${#temporals.format(av.dataAvaliacao, 'dd/MM/yyyy HH:mm')}"></small>
                        </div>
                        <p class="mt-2 mb-0" th:text="${av.comentario}"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</html>
