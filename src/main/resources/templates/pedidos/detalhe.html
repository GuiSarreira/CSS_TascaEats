<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt">

<head>
    <meta charset="UTF-8">
    <title th:text="'Pedido #' + ${pedido.id}">Detalhe do Pedido</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body>
    <div class="container mt-4">

        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item">
                    <a th:href="@{/pedidos(clienteId=${pedido.cliente.id})}">Pedidos</a>
                </li>
                <li class="breadcrumb-item active" th:text="'Pedido #' + ${pedido.id}"></li>
            </ol>
        </nav>

        <!-- Cabeçalho -->
        <div class="d-flex justify-content-between align-items-start mb-4">
            <div>
                <h2 th:text="'Pedido #' + ${pedido.id}"></h2>
                <p class="text-muted mb-0" th:text="${#temporals.format(pedido.dataHora, 'dd/MM/yyyy HH:mm')}"></p>
            </div>
            <span th:text="${pedido.status}"
                th:classappend="${pedido.status.name() == 'DELIVERED'} ? 'badge bg-success fs-6' :
                              (${pedido.status.name() == 'CANCELLED'} ? 'badge bg-danger fs-6' :
                              (${pedido.status.name() == 'CREATED'} ? 'badge bg-secondary fs-6' : 'badge bg-warning text-dark fs-6'))">
            </span>
        </div>

        <div class="row g-4">

            <!-- Coluna esquerda: itens + morada -->
            <div class="col-md-7">

                <!-- Itens do pedido -->
                <div class="card mb-3">
                    <div class="card-header">Itens</div>
                    <table class="table table-sm mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>Produto</th>
                                <th class="text-end">Preço unit.</th>
                                <th class="text-end">Qtd</th>
                                <th class="text-end">Subtotal</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="item : ${pedido.produtosPedido}">
                                <td th:text="${item.produto.nome}"></td>
                                <td class="text-end" th:text="${#numbers.formatDecimal(item.precoCompra, 1, 2) + ' €'}">
                                </td>
                                <td class="text-end" th:text="${item.quantity}"></td>
                                <td class="text-end"
                                    th:text="${#numbers.formatDecimal(item.precoCompra * item.quantity, 1, 2) + ' €'}">
                                </td>
                            </tr>
                        </tbody>
                        <tfoot>
                            <tr class="fw-bold">
                                <td colspan="3" class="text-end">Total</td>
                                <td class="text-end"
                                    th:text="${#numbers.formatDecimal(pedido.precoTotal, 1, 2) + ' €'}"></td>
                            </tr>
                        </tfoot>
                    </table>
                </div>

                <!-- Morada de entrega -->
                <div class="card">
                    <div class="card-header">Morada de entrega</div>
                    <div class="card-body">
                        <p class="mb-0" th:text="${pedido.enderecoEntrega.rua}"></p>
                        <p class="mb-0"
                            th:text="${pedido.enderecoEntrega.codigoPostal + ' ' + pedido.enderecoEntrega.cidade}"></p>
                    </div>
                </div>
            </div>

            <!-- Coluna direita: ações + entrega + pagamento -->
            <div class="col-md-5">

                <!-- Ações -->
                <div class="card mb-3">
                    <div class="card-header">Ações</div>
                    <div class="card-body d-flex flex-column gap-2">

                        <!-- Pagar (só se CREATED) -->
                        <a th:if="${pedido.status.name() == 'CREATED'}"
                            th:href="@{/pagamentos/novo(pedidoId=${pedido.id},clienteId=${pedido.cliente.id})}"
                            class="btn btn-success">Pagar</a>

                        <!-- Cancelar (só se CREATED ou PAID) -->
                        <form th:if="${pedido.status.name() == 'CREATED' or pedido.status.name() == 'PAID'}"
                            th:action="@{/pedidos/{id}/cancelar(id=${pedido.id})}" method="post">
                            <input type="hidden" name="clienteId" th:value="${pedido.cliente.id}">
                            <button type="submit" class="btn btn-outline-danger w-100"
                                onclick="return confirm('Cancelar este pedido?')">Cancelar Pedido</button>
                        </form>

                        <!-- Avaliar (só se DELIVERED e sem avaliação ainda) -->
                        <a th:if="${pedido.status.name() == 'DELIVERED'}"
                            th:href="@{/avaliacoes/novo(pedidoId=${pedido.id},clienteId=${pedido.cliente.id})}"
                            class="btn btn-outline-primary">Avaliar Restaurante</a>
                    </div>
                </div>

                <!-- Entrega -->
                <div class="card mb-3">
                    <div class="card-header">Entrega</div>
                    <div class="card-body" th:if="${pedido.entrega != null}">
                        <p class="mb-1">
                            <strong>Estado:</strong>
                            <span th:text="${pedido.entrega.status}"></span>
                        </p>
                        <p class="mb-1">
                            <strong>Entregador:</strong>
                            <span th:text="${pedido.entrega.entregador.nome}"></span>
                        </p>
                        <p class="mb-1" th:if="${pedido.entrega.horaRetirada != null}">
                            <strong>Retirado:</strong>
                            <span th:text="${#temporals.format(pedido.entrega.horaRetirada, 'HH:mm')}"></span>
                        </p>
                        <p class="mb-0" th:if="${pedido.entrega.horaEntrega != null}">
                            <strong>Entregue:</strong>
                            <span th:text="${#temporals.format(pedido.entrega.horaEntrega, 'HH:mm')}"></span>
                        </p>
                    </div>
                    <div class="card-body text-muted" th:if="${pedido.entrega == null}">
                        Entrega ainda não atribuída.
                    </div>
                </div>

                <!-- Pagamento -->
                <div class="card">
                    <div class="card-header">Pagamento</div>
                    <div class="card-body" th:if="${pedido.pagamento != null}">
                        <p class="mb-1">
                            <strong>Tipo:</strong>
                            <span th:text="${pedido.pagamento.class.simpleName}"></span>
                        </p>
                        <p class="mb-0">
                            <strong>Valor:</strong>
                            <span th:text="${#numbers.formatDecimal(pedido.pagamento.valor, 1, 2) + ' €'}"></span>
                        </p>
                    </div>
                    <div class="card-body text-muted" th:if="${pedido.pagamento == null}">
                        Pagamento pendente.
                    </div>
                </div>
            </div>
        </div>

    </div>
</body>

</html>
