<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}">

<head>
    <title>TascaEats - Login</title>
</head>
<div layout:fragment="content" class="auth-shell">
    <div class="auth-card-te">
        <h2>Iniciar sessão</h2>

        <div th:if="${error}" class="auth-message error" th:text="${error}"></div>

        <form th:action="@{/login}" th:object="${loginRequest}" method="post" class="auth-form-te">
            <div class="field-group-te">
                <label for="email">Email</label>
                <input id="email" type="email" th:field="*{email}" placeholder="nome@exemplo.com" required>
            </div>

            <div class="field-group-te">
                <label for="password">Palavra-passe</label>
                <input id="password" type="password" th:field="*{password}" required>
            </div>

            <button type="submit" class="auth-btn-te">Entrar</button>
        </form>

        <p class="auth-link-te">
            Ainda não tens conta?
            <a th:href="@{/register}">Regista-te</a>
        </p>
    </div>
</div>

</html>
