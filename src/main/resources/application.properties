spring.jpa.database-platform = org.hibernate.dialect.PostgreSQLDialect
#spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation = true
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.PostgreSQLDialect
#spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.H2Dialect
# Hibernate ddl auto (create, create-drop, validate, update)
#spring.jpa.hibernate.ddl-auto = update
# for production environment, this variable should be validate
spring.jpa.hibernate.ddl-auto=create-drop

spring.datasource.url = jdbc:postgresql://localhost:5432/postgres
spring.datasource.username = user
spring.datasource.password = password

spring.jpa.show-sql=true


logging.level.org.springframework=INFO
logging.level.com.mkyong=INFO
logging.level.com.zaxxer=DEBUG
logging.level.root=ERROR


spring.datasource.hikari.connectionTimeout=20000
spring.datasource.hikari.maximumPoolSize=5

logging.pattern.console=%-5level %logger{36} - %msg%n

# Server Port (desenvolvimento local usa 8082 para evitar conflito com Docker/WSL)
server.port=8082

# Desativar restart automatico do devtools (evita falha quando javafx:run recompila target/classes)
spring.devtools.restart.enabled=false

# gRPC Configuration (desenvolvimento local usa 9092 para evitar conflito com Docker/WSL)
grpc.server.port=9092
grpc.server.enable-keep-alive=true
grpc.server.keep-alive-time=30s
grpc.server.keep-alive-timeout=10s

# Kafka Configuration (desenvolvimento local — em Docker é sobreposto pela env var SPRING_KAFKA_BOOTSTRAP_SERVERS)
# Usar porta 9093 localmente para evitar conflito com gRPC (9092)
spring.kafka.bootstrap-servers=localhost:9093

# Logging Kafka (verificar publicação de eventos nos logs)
logging.level.pt.ul.fc.css.tascaeats.services.PagamentoService=DEBUG
logging.level.org.apache.kafka=WARN
logging.level.org.springframework.kafka=INFO
