# Test profile - Disable JPA/database initialization
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=false

# H2 in-memory database (for reference only)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# gRPC Configuration
grpc.server.port=9090
grpc.server.enable-keep-alive=true
grpc.server.keep-alive-time=30s
grpc.server.keep-alive-timeout=10s

logging.level.root=WARN
logging.level.net.devh.boot.grpc=INFO
logging.level.org.springframework.boot=INFO
