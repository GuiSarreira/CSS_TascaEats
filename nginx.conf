# ═══════════════════════════════════════════════════════════════
#  NGINX Reverse Proxy — TascaEats
#  • Bloco http  → proxy REST (porta 80  → springbootapp:8080)
#  • Bloco stream → proxy gRPC TCP passthrough (porta 9090 → springbootapp:9090)
# ═══════════════════════════════════════════════════════════════

# ── REST (HTTP) ─────────────────────────────────────────────────
http {
    upstream monolito_rest {
        server springbootapp:8080;
    }

    server {
        listen 80;

        location / {
            proxy_pass         http://monolito_rest;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }
}

# ── gRPC (TCP passthrough) ──────────────────────────────────────
stream {
    upstream monolito_grpc {
        server springbootapp:9090;
    }

    server {
        listen 9090;
        proxy_pass monolito_grpc;
    }
}

# Necessário para o nginx não dar erro de "missing events"
events {
    worker_connections 1024;
}
